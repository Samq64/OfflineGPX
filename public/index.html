<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapsforge Extract Tool</title>
<!-- Leaflet's own recommended tags: pinned, with integrity hashes, so a changed CDN file won't load. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { color-scheme: dark; --bg:#14161a; --panel:#1c1f26; --line:#2c313b; --ink:#e6e8ec; --dim:#9aa3b2; --accent:#6ea8fe; --select:#e4007c; }
  * { box-sizing: border-box; }
  /* dvh, not vh: a phone browser's address bar is part of the viewport by the vh
     definition and not by the one anybody means. */
  body { margin:0; height:100dvh; display:flex; flex-direction:column; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  h1 { font-size:15px; margin:0; padding:14px 16px; border-bottom:1px solid var(--line); font-weight:600; flex:none; }
  /* Narrow: the map on top, the controls under it, each scrolling on its own. The map
     has to stay big enough to draw a rectangle on, which is the whole point of it. */
  main { flex:1; min-height:0; display:flex; flex-direction:column-reverse; }
  #side { flex:1 1 auto; min-height:0; overflow:auto; background:var(--panel); border-top:1px solid var(--line); }
  #map { flex:1 1 50%; min-height:220px; }
  @media (min-width: 720px) {
    main { flex-direction:row; }
    #side { flex:none; width:340px; border-top:0; border-right:1px solid var(--line); }
    #map { flex:1; }
  }
  .pad { padding:12px 16px; border-bottom:1px solid var(--line); }
  .crumbs { font-size:12px; color:var(--dim); margin-bottom:8px; word-break:break-all; }
  .crumbs a { display:inline-block; padding:4px 2px; color:var(--accent); text-decoration:none; cursor:pointer; }
  ul { list-style:none; margin:0; padding:0; max-height:34vh; overflow:auto; }
  /* A finger, not a cursor: these are the only targets on the screen and they are a list
     of near-identical words. */
  li a { display:block; padding:10px 8px; border-radius:5px; color:var(--ink); text-decoration:none; cursor:pointer; }
  li a:hover, li a:active { background:#262b34; }
  li a.map::after { content:' .map'; color:var(--dim); font-size:11px; }
  button { width:100%; padding:12px; border:0; border-radius:6px; background:var(--accent); color:#0b0d10; font-weight:600; cursor:pointer; font-size:14px; }
  button:disabled { background:#3a4150; color:#6d7688; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); margin-bottom:8px; }
  button.ghost.on { border-color:var(--accent); color:var(--accent); }
  /* While a rectangle is being dragged out, the gesture belongs to this page rather than
     to the browser's own scroll and zoom. */
  body.drawing #map { touch-action:none; }
  .meta { font-size:12px; color:var(--dim); }
  .meta b { color:var(--ink); font-weight:500; }
  code { font-size:11px; color:var(--dim); word-break:break-all; }
  .handle { background:#fff; border:2px solid var(--select); border-radius:3px; }
</style>
</head>
<body>
<h1>Mapsforge Extract Tool</h1>
<main>
<div id="side">
  <div class="pad">
    <div class="crumbs" id="crumbs"></div>
    <ul id="tree"></ul>
  </div>
  <div class="pad">
    <div class="meta" id="source">Pick a region to cut from.</div>
  </div>
  <div class="pad">
    <button class="ghost" id="draw" disabled>Draw a rectangle</button>
    <div class="meta" id="selection">No area selected.</div>
  </div>
  <div class="pad">
    <button id="go" disabled>Extract .map</button>
    <div class="meta" id="status" style="margin-top:8px"></div>
  </div>
</div>
<div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const map = L.map('map', { boxZoom: false }).setView([46, 8], 4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

const $ = (id) => document.getElementById(id);
let path = '';          // where we are in the upstream tree
let source = null;      // the chosen .map and its bbox
let sourceBox = null;   // its outline on the map
let bbox = null;

async function api(route, params) {
  const url = new URL(route, location.origin);
  Object.entries(params ?? {}).forEach(([k, v]) => url.searchParams.set(k, v));
  const response = await fetch(url);
  const body = await response.json().catch(() => ({ error: response.statusText }));
  if (!response.ok) throw new Error(body.error ?? 'request failed');
  return body;
}

async function browse(next) {
  path = next;
  $('tree').innerHTML = '<li class="meta" style="padding:5px 8px">Loading…</li>';
  const parts = path.split('/').filter(Boolean);
  $('crumbs').replaceChildren(...[link('maps', { to: '' }), ...parts.map((p, i) =>
    link(p, { to: parts.slice(0, i + 1).join('/') }))].flatMap((a, i) => (i ? [' / ', a] : [a])));

  const { directories, maps } = await api('/api/list', { path });
  const prefix = path ? path + '/' : '';
  const items = [
    ...directories.map((d) => link(`${d}/`, { to: prefix + d })),
    ...maps.map((m) => Object.assign(link(m.replace(/\.map$/, ''), { map: prefix + m }), { className: 'map' })),
  ].map((a) => el('li', a));
  $('tree').innerHTML = items.length ? '' : '<li class="meta" style="padding:5px 8px">Empty.</li>';
  $('tree').append(...items);
}

// Names and comments come from upstream, so they go in as text, never as markup.
const el = (tag, ...children) => {
  const node = document.createElement(tag);
  node.append(...children);
  return node;
};
const link = (text, data) => {
  const a = el('a', text);
  Object.assign(a.dataset, data);
  return a;
};

document.addEventListener('click', async (event) => {
  const link = event.target.closest('a');
  if (!link) return;
  event.preventDefault();
  try {
    if (link.dataset.to !== undefined) await browse(link.dataset.to);
    else if (link.dataset.map) await choose(link.dataset.map);
  } catch (error) { $('status').textContent = error.message; }
});

async function choose(mapPath) {
  // A selection drawn on the previous map means nothing on this one.
  box = null;
  render();
  bbox = null;
  $('selection').textContent = 'No area selected.';
  $('go').disabled = true;
  $('source').textContent = 'Reading header…';
  source = await api('/api/source', { path: mapPath });
  const b = source.bbox;
  sourceBox?.remove();
  // The region's real outline where the server found one; the header's box takes in
  // neighbours the file has no data for. Near-black dashes on a white edge: light tiles
  // show the dark, dark ones the white. Unlike the selection's magenta, so the two never
  // read as one shape.
  const rings = source.outline ??
    [[[b.minLat, b.minLon], [b.minLat, b.maxLon], [b.maxLat, b.maxLon], [b.maxLat, b.minLon]]];
  const closed = rings.map((ring) => [...ring, ring[0]]);
  sourceBox = L.layerGroup([
    L.polyline(closed, { color: '#fff', weight: 5, opacity: 0.9, interactive: false }),
    L.polyline(closed, { color: '#1b1f27', weight: 2.5, dashArray: '8 6', interactive: false }),
  ]).addTo(map);
  map.fitBounds(L.latLngBounds(rings.flat()), { padding: [30, 30] });

  const zooms = source.intervals.map((i) => `z${i.min}-${i.max}`).join(', ');
  const requests = Object.assign(el('span', `header read in ${source.requests} range requests`),
    { style: 'color:#6ea8fe' });
  $('source').replaceChildren(el('b', mapPath), el('br'), zooms,
    ...(source.comment ? [el('br'), el('code', source.comment)] : []), el('br'), requests);
  $('draw').disabled = false;
  update();
}

// --- Selection ---------------------------------------------------------------
//
// Pointer events rather than Leaflet's mouse ones: a touch screen sends a browser no
// mousemove while a finger is down, so a drag built on mousedown/mousemove/mouseup
// works with a mouse and does nothing at all on a phone.

const canvas = map.getContainer();
let drawing = false;
let box = null;      // the selection as { w, s, e, n }
let gesture = null;  // { mode, from, start } while a drag is under way

// Magenta, edged in white, over a dimmed outside: OSM's tiles have greens, blues, beiges
// and pink roads but nothing this saturated, so it holds up on any of them.
const SELECT = getComputedStyle(document.documentElement).getPropertyValue('--select').trim();
const WORLD = [[-85, -540], [-85, 540], [85, 540], [85, -540]];
const layers = L.layerGroup().addTo(map);
const mask = L.polygon([WORLD], { stroke: false, fillColor: '#000', fillOpacity: 0.35, interactive: false });
const casing = L.rectangle([[0, 0], [0, 0]], { color: '#fff', weight: 6, fill: false, interactive: false });
const outline = L.rectangle([[0, 0], [0, 0]], { color: SELECT, weight: 2.5, fill: false, interactive: false });
const HANDLES = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
const handleIcon = L.divIcon({ className: 'handle', iconSize: [14, 14] });
const handles = HANDLES.map((mode) =>
  [mode, L.marker([0, 0], { icon: handleIcon, interactive: false, keyboard: false })]);
const CURSORS = {
  n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize',
  nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize', move: 'move',
};

// Halfway in Mercator, so an edge's handle sits at its middle on screen.
const midLat = (s, n) =>
  map.unproject(map.project([s, 0], 0).add(map.project([n, 0], 0)).divideBy(2), 0).lat;

function render() {
  if (!box) {
    layers.clearLayers();
    return;
  }
  const { w, s, e, n } = box;
  const mid = { lat: midLat(s, n), lng: (w + e) / 2 };
  mask.setLatLngs([WORLD, [[s, w], [n, w], [n, e], [s, e]]]);
  casing.setBounds([[s, w], [n, e]]);
  outline.setBounds([[s, w], [n, e]]);
  for (const [mode, marker] of handles) {
    const lat = mode.includes('n') ? n : mode.includes('s') ? s : mid.lat;
    const lng = mode.includes('w') ? w : mode.includes('e') ? e : mid.lng;
    marker.setLatLng([lat, lng]);
  }
  [mask, casing, outline, ...handles.map(([, marker]) => marker)].forEach((l) => layers.addLayer(l));
}

/** The map's own gestures would otherwise pan and pinch underneath the box. */
function freeze(on) {
  document.body.classList.toggle('drawing', on);
  map.dragging[on ? 'disable' : 'enable']();
  map.touchZoom[on ? 'disable' : 'enable']();
  map.doubleClickZoom[on ? 'disable' : 'enable']();
}

function setDrawing(on) {
  drawing = on;
  freeze(on);
  canvas.style.cursor = on ? 'crosshair' : '';
  $('draw').classList.toggle('on', on);
  $('draw').textContent = on ? 'Drag on the map…' : box ? 'Draw a new rectangle' : 'Draw a rectangle';
}

$('draw').onclick = () => setDrawing(!drawing);

const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

const pointIn = (event) => {
  const rect = canvas.getBoundingClientRect();
  return L.point(event.clientX - rect.left, event.clientY - rect.top);
};

/**
 * Where a pointer is, in the map's own coordinates, held inside the source file's own box.
 * Dragging past the edge pins the rectangle to it rather than selecting ground the file
 * does not contain - the cut would come back empty there, and the box is drawn on screen,
 * so a selection crossing it is a question already answered.
 */
const at = (event) => {
  const point = map.containerPointToLatLng(pointIn(event));
  const b = source.bbox;
  return L.latLng(clamp(point.lat, b.minLat, b.maxLat), clamp(point.lng, b.minLon, b.maxLon));
};

/**
 * What a press at [event] would grab: an edge or corner within reach, else the inside to
 * move it, else nothing. Reach is a fingertip for touch, but never more than a third of the
 * box, so a small one can still be moved.
 */
function hit(event) {
  if (!box) return null;
  const p = pointIn(event);
  const nw = map.latLngToContainerPoint([box.n, box.w]);
  const se = map.latLngToContainerPoint([box.s, box.e]);
  const reach = event.pointerType === 'mouse' ? 8 : 22;
  const reachX = Math.min(reach, (se.x - nw.x) / 3);
  const reachY = Math.min(reach, (se.y - nw.y) / 3);
  if (p.x < nw.x - reach || p.x > se.x + reach || p.y < nw.y - reach || p.y > se.y + reach) return null;
  const v = p.y <= nw.y + reachY ? 'n' : p.y >= se.y - reachY ? 's' : '';
  const h = p.x <= nw.x + reachX ? 'w' : p.x >= se.x - reachX ? 'e' : '';
  return v + h || 'move';
}

// Capturing, so a grab of the box never also reaches Leaflet as the start of a pan.
canvas.addEventListener('pointerdown', (event) => {
  if (!source || !event.isPrimary) return;
  const mode = drawing ? 'draw' : hit(event);
  if (!mode) return;
  event.preventDefault();
  event.stopPropagation();
  canvas.setPointerCapture(event.pointerId);
  if (!drawing) freeze(true);
  const from = at(event);
  const start = mode === 'draw' ? { w: from.lng, e: from.lng, s: from.lat, n: from.lat } : { ...box };
  gesture = { mode, from, start };
  if (mode === 'draw') {
    box = start;
    render();
  }
}, true);

canvas.addEventListener('pointermove', (event) => {
  if (!gesture) {
    if (!drawing) canvas.style.cursor = CURSORS[hit(event)] ?? '';
    return;
  }
  event.preventDefault();
  const p = at(event);
  const { mode, from, start } = gesture;
  if (mode === 'move') {
    // The whole box stays inside the file's, not just the pointer.
    const b = source.bbox;
    const dLat = clamp(p.lat - from.lat, b.minLat - start.s, b.maxLat - start.n);
    const dLng = clamp(p.lng - from.lng, b.minLon - start.w, b.maxLon - start.e);
    box = { w: start.w + dLng, e: start.e + dLng, s: start.s + dLat, n: start.n + dLat };
  } else {
    // Drawing drags the corner opposite where the press was. An edge pulled past its
    // opposite flips the box rather than inverting it.
    const edges = mode === 'draw' ? 'se' : mode;
    const next = { ...start };
    if (edges.includes('n')) next.n = p.lat;
    if (edges.includes('s')) next.s = p.lat;
    if (edges.includes('e')) next.e = p.lng;
    if (edges.includes('w')) next.w = p.lng;
    box = {
      w: Math.min(next.w, next.e), e: Math.max(next.w, next.e),
      s: Math.min(next.s, next.n), n: Math.max(next.s, next.n),
    };
  }
  render();
});

// Cancel counts as an end: a system gesture taking the pointer away mid-drag must not
// leave the map frozen with no way back.
for (const type of ['pointerup', 'pointercancel']) {
  canvas.addEventListener(type, () => {
    if (!gesture) return;
    const { mode, start } = gesture;
    gesture = null;
    // A tap is not a rectangle. Easy to do by accident with a finger, and a zero-area cut
    // is a request for an empty file. Drawing stays on for another try.
    if (box.n === box.s || box.e === box.w) {
      box = mode === 'draw' ? null : start;
      render();
      if (mode !== 'draw') freeze(false);
      return;
    }
    if (mode === 'draw') setDrawing(false);
    else freeze(false);
    bbox = [box.w, box.s, box.e, box.n].map((n) => n.toFixed(6));
    update();
  });
}

function update() {
  if (!bbox) return;
  const [w, s, e, n] = bbox.map(Number);
  const km = (a, b) => Math.abs(a - b) * 111.32;
  const width = km(e, w) * Math.cos(((n + s) / 2) * Math.PI / 180);
  $('selection').innerHTML =
    `<b>${width.toFixed(1)} × ${km(n, s).toFixed(1)} km</b><br><code>${bbox.join(', ')}</code>` +
    '<br>Drag the box to move it, or its edges to resize.';
  $('go').disabled = !source;
}

const mb = (bytes) => `${(bytes / 1e6).toFixed(2)} MB`;
const seconds = (since) => `${((Date.now() - since) / 1000).toFixed(1)}s`;

$('go').onclick = async () => {
  $('go').disabled = true;
  // A cut is tens of seconds. On a phone the status sits below the fold, where an
  // unexplained wait looks like a button that did nothing.
  $('status').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const started = Date.now();

  // Not crypto.randomUUID: it needs a secure context, and this is served over plain http.
  const job = Math.random().toString(36).slice(2);
  let upstream = null;
  let received = null, total = null;
  const render = () => {
    const read = upstream?.bytes != null
      ? ` · ${mb(upstream.bytes)} read upstream in ${upstream.requests} requests` : '';
    $('status').textContent = received == null
      ? `Cutting… ${seconds(started)}${read}`
      : `Downloading… ${seconds(started)} · ${mb(received)}` +
        (total ? ` of ${mb(total)} (${Math.round((received / total) * 100)}%)` : '');
  };
  const clock = setInterval(render, 100);
  const poll = setInterval(async () => {
    upstream = await api('/api/progress', { job }).catch(() => upstream);
  }, 500);
  render();

  try {
    const url = new URL('/api/extract', location.origin);
    url.searchParams.set('path', source.path);
    url.searchParams.set('bbox', bbox.join(','));
    url.searchParams.set('job', job);
    const response = await fetch(url);
    clearInterval(poll);
    if (!response.ok) throw new Error((await response.json()).error);

    // Read in chunks rather than blob(), to count the file arriving.
    total = Number(response.headers.get('content-length')) || null;
    received = 0;
    const chunks = [];
    const reader = response.body.getReader();
    for (let r = await reader.read(); !r.done; r = await reader.read()) {
      chunks.push(r.value);
      received += r.value.length;
    }
    const blob = new Blob(chunks);
    const link = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: response.headers.get('content-disposition')?.match(/"(.+)"/)?.[1] ?? 'extract.map',
    });
    link.click();
    // Revoking straight away can cancel the download before the browser has started it.
    setTimeout(() => URL.revokeObjectURL(link.href), 60_000);

    clearInterval(clock);
    $('status').innerHTML = `<b>${mb(blob.size)}</b> in ${seconds(started)} — ` +
      `${response.headers.get('x-upstream-requests')} upstream range requests, ` +
      `${mb(Number(response.headers.get('x-upstream-bytes')))} read`;
  } catch (error) {
    clearInterval(clock);
    $('status').textContent = error.message;
  } finally {
    clearInterval(poll);
  }
  $('go').disabled = false;
};

browse('').catch((error) => { $('status').textContent = error.message; });
</script>
</body>
</html>
