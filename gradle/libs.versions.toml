[versions]
# AGP 9.4 supports up to API 37 and requires Gradle 9.1+ and JDK 17+.
agp = "9.4.1"
# Only for the Compose compiler plugin; AGP 9 has Kotlin built in.
kotlin = "2.4.20"

compileSdk = "37"
minSdk = "29"
targetSdk = "37"

# Compose 1.12+ requires compileSdk 37 / AGP 9.1.1+.
composeBom = "2026.09.00"
core = "1.19.1"
# GPS altitude to sea level; ~150 KB, mostly its geoid map. The platform's own on API 34+.
coreLocationAltitude = "1.0.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"

# Versioned independently of Kotlin since 2.3.0.
ksp = "2.3.12"
room = "2.8.5"
navigation = "2.10.2"
serialization = "1.11.0"

kxml2 = "2.3.0"
# Matches the kotlinx-coroutines that Compose and Room resolve to.
coroutines = "1.9.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Compose ui-test brings 3.5, which calls InputManager.getInstance, gone on recent APIs.
espresso = "3.7.0"

# Gradle's and AGP's built-in coverage; pinned for current Kotlin bytecode.
jacoco = "0.8.15"

# Plain jars, so no manifest or permissions. Its native tessellator is ~45 KB per ABI.
vtm = "0.30.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-core-location-altitude = { group = "androidx.core", name = "core-location-altitude", version.ref = "coreLocationAltitude" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Type-safe routes are @Serializable classes, so navigation needs the runtime too.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }

vtm = { group = "com.github.mapsforge.vtm", name = "vtm", version.ref = "vtm" }
vtm-android = { group = "com.github.mapsforge.vtm", name = "vtm-android", version.ref = "vtm" }
# The filled overlays: each map's land box.
vtm-jts = { group = "com.github.mapsforge.vtm", name = "vtm-jts", version.ref = "vtm" }

androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
# A real XmlPullParser for JVM tests; android.jar's is a stub.
kxml2 = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml2" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
