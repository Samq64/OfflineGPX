[versions]
# AGP 9.4.0 (Sept 2026) supports up to API 37 and requires Gradle 9.1+ and JDK 17+.
agp = "9.4.0"
# Kotlin 2.4.20 (7 Sept 2026). Only the Compose *compiler* plugin is applied from this:
# since AGP 9.0, Kotlin support is built in and applying org.jetbrains.kotlin.android
# is an error ("...plugin is no longer required for Kotlin support since AGP 9.0").
kotlin = "2.4.20"

compileSdk = "37"
minSdk = "29"
targetSdk = "37"

# Compose BOM 2026.08.00 = Compose 1.12, which itself requires compileSdk 37 / AGP 9.1.1+.
composeBom = "2026.08.00"
core = "1.19.0"
activityCompose = "1.11.0"
lifecycle = "2.11.0"

# Versioned independently of Kotlin since 2.3.0.
ksp = "2.3.12"
room = "2.8.5"
navigation = "2.10.1"
serialization = "1.11.0"

kxml2 = "2.3.0"

# VTM, mapsforge's OpenGL renderer. Draws the basemap from a .map file the user supplied.
#
# Plain jars rather than AARs, so it contributes no AndroidManifest and therefore no
# permissions. Its one native library (a polygon tessellator) is ~45 KB per ABI.
vtm = "0.30.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The small icon set only. Deliberately not material-icons-extended, which is a very large
# artifact for the handful of glyphs this app uses.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Type-safe routes are @Serializable classes, so navigation needs the runtime too.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }

vtm = { group = "com.github.mapsforge.vtm", name = "vtm", version.ref = "vtm" }
vtm-android = { group = "com.github.mapsforge.vtm", name = "vtm-android", version.ref = "vtm" }
# The filled overlays: each map's land box.
vtm-jts = { group = "com.github.mapsforge.vtm", name = "vtm-jts", version.ref = "vtm" }

kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
# Test-only: a real XmlPullParser so GpxParser is testable on the JVM without
# Robolectric - android.jar's xmlpull classes are unimplemented stubs in unit tests.
kxml2 = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
