# Verified against the Android/JetBrains release notes in September 2026.
# Nothing here was compiled locally (no JDK or Android SDK on this machine), so if
# Android Studio flags a newer stable, take it - this file is the only place to change.
[versions]
# AGP 9.4.0 (Sept 2026) supports up to API 37 and requires Gradle 9.1+ and JDK 17+.
agp = "9.4.0"
# Kotlin 2.4.20 (7 Sept 2026). Only the Compose *compiler* plugin is applied from this:
# since AGP 9.0, Kotlin support is built in and applying org.jetbrains.kotlin.android
# is an error ("...plugin is no longer required for Kotlin support since AGP 9.0").
kotlin = "2.4.20"

compileSdk = "37"
minSdk = "29"
targetSdk = "37"

# Compose BOM 2026.08.00 = Compose 1.12, which itself requires compileSdk 37 / AGP 9.1.1+.
composeBom = "2026.08.00"
coreKtx = "1.19.0"
activityCompose = "1.11.0"
lifecycle = "2.11.0"

# KSP dropped the "<kotlin>-<ksp>" pairing at 2.3.0 and is versioned independently now,
# so this no longer has to track the Kotlin version - and a "2.4.20-x.y.z" spelling does
# not exist to be found.
ksp = "2.3.12"
room = "2.8.5"
navigation = "2.10.1"
serialization = "1.11.0"

kxml2 = "2.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Supplies collectAsStateWithLifecycle - it is not in lifecycle-runtime-ktx.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The small icon set only. Deliberately not material-icons-extended, which is a very large
# artifact for the handful of glyphs this app uses.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Type-safe routes are @Serializable classes, so navigation needs the runtime too.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
# Test-only: a real XmlPullParser so GpxParser is testable on the JVM without
# Robolectric - android.jar's xmlpull classes are unimplemented stubs in unit tests.
kxml2 = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
